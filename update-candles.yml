name: Atualizar gráfico de velas de contribuições

on:
  schedule:
    # 03:10 UTC = 00:10 em America/Sao_Paulo (UTC-3) — roda logo após o
    # dia anterior fechar no seu fuso horário.
    - cron: "10 3 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update-candles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar velas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_candles.py

      - name: Commitar mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add commit-candles.svg candles-data.json
          git diff --staged --quiet && echo "Nada novo para commitar." || git commit -m "chore: atualizar gráfico de velas de contribuições"
          git push
